<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzübersicht</title>
<style>
:root{
  --bg:#f2f2f7;--card:rgba(255,255,255,.92);--text:#111827;--muted:#8a8a92;
  --accent:#007aff;--green:#34c759;--red:#ff3b30;--border:#e5e5ea
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.container{width:100%;max-width:520px;margin:auto;padding:env(safe-area-inset-top) 16px calc(34px + env(safe-area-inset-bottom))}
header{padding:18px 4px 16px;display:flex;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.7px}
h2{margin:0 0 14px;font-size:20px;letter-spacing:-.2px}
.muted{color:var(--muted)}
header .muted{font-size:14px;margin-top:6px}
header .secondary{padding:8px 10px;font-size:13px;border-radius:10px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{padding:16px;border-radius:17px;background:var(--card);border:1px solid rgba(0,0,0,.04);box-shadow:0 5px 20px rgba(0,0,0,.045)}
.stat:first-child{grid-column:1/-1}
.stat span{font-size:13px}
.stat strong{display:block;font-size:26px;letter-spacing:-.7px;margin-top:4px}
.card{background:var(--card);border:1px solid rgba(0,0,0,.04);border-radius:20px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.045);margin-bottom:14px}
.grid{display:flex;flex-direction:column;gap:0}
form{display:grid;gap:11px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.small{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 3px}
input,select,button{font:inherit;-webkit-appearance:none}
input,select{width:100%;height:48px;padding:0 13px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--text);font-size:16px;outline:none}
input:focus,select:focus{border-color:#8dbfff;box-shadow:0 0 0 3px rgba(0,122,255,.10)}
button{border:0;cursor:pointer;font-weight:650;min-height:44px;border-radius:13px;transition:transform .08s}
button:active{transform:scale(.98)}
.primary{background:var(--accent);color:#fff}
.secondary{background:#e9e9ee;color:#3a3a3c}
.danger{background:#ffe5e3;color:#d70015;min-height:30px;padding:5px 9px;font-size:12px;border-radius:9px}
.expenses{margin-top:23px}
.expense{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--border)}
.expense:last-child{border-bottom:0;padding-bottom:2px}
.expense strong{font-size:15px}.amount{font-weight:750;font-size:15px;white-space:nowrap}
.small{font-size:12px}
.empty{padding:20px 5px;text-align:center;color:var(--muted);font-size:14px}
.chart-wrap{display:flex;justify-content:center;align-items:center;padding:2px 0 4px}
canvas{width:min(280px,100%);height:auto}
.legend{display:grid;gap:10px;margin-top:8px}
.legend-item{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.category-list{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:#f0f0f5;padding:8px 9px 8px 12px;border-radius:999px;font-size:13px}
@media(min-width:700px){
  .container{max-width:1000px;padding-top:28px}
  .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
  .card{margin-bottom:0}
  .summary{grid-template-columns:repeat(3,1fr)}
  .stat:first-child{grid-column:auto}
}
</style>
</head>
<body>
<div class="container">
<header>
  <div><h1>Finanzen</h1><div class="muted">Deine Ausgaben auf einen Blick</div></div>
</header>

<div class="summary">
  <div class="stat"><span class="muted">Ausgaben gesamt</span><strong id="total">0,00 €</strong></div>
  <div class="stat"><span class="muted">Anzahl Ausgaben</span><strong id="count">0</strong></div>
  <div class="stat"><span class="muted">Kategorien</span><strong id="catCount">0</strong></div>
</div>

<div class="grid">
<section class="card">
  <h2>Neue Ausgabe</h2>
  <form id="expenseForm">
    <div class="row">
      <div><label class="small">Betrag (€)</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="z. B. 12,50" required></div>
      <div><label class="small">Kategorie</label><select id="category"></select></div>
    </div>
    <div><label class="small">Beschreibung (optional)</label><input id="description" maxlength="80" placeholder="z. B. Wocheneinkauf"></div>
    <button class="primary" type="submit">Ausgabe hinzufügen</button>
  </form>

  <div class="expenses">
    <h2>Ausgaben</h2>
    <div id="expenseList"></div>
  </div>
</section>

<section class="card">
  <h2>Ausgaben nach Kategorie</h2>
  <div class="chart-wrap"><canvas id="pie" width="320" height="320"></canvas></div>
  <div id="legend" class="legend"></div>
</section>
</div>

<section class="card" style="margin-top:18px">
  <h2>Kategorien</h2>
  <div class="row">
    <div><input id="newCategory" maxlength="30" placeholder="Neue Kategorie, z. B. Freizeit"></div>
    <button class="primary" onclick="addCategory()">Hinzufügen</button>
  </div>
  <div id="categoryList" class="category-list" style="margin-top:14px"></div><button class="secondary" style="width:100%;margin-top:14px" onclick="resetData()">Alle Daten zurücksetzen</button>
</section>
</div>

<script>
const defaultCategories=["Essen","Drogerie","Sonstiges"];
let data=JSON.parse(localStorage.getItem("financeApp")||"null")||{categories:defaultCategories,expenses:[]};
const colors=["#4f46e5","#16a34a","#f59e0b","#dc2626","#0891b2","#9333ea","#db2777","#65a30d","#ea580c","#475569"];

function euro(n){return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n)}
function save(){localStorage.setItem("financeApp",JSON.stringify(data));render()}
function addCategory(){
  const el=document.getElementById("newCategory"), name=el.value.trim();
  if(!name)return;
  if(data.categories.some(c=>c.toLowerCase()===name.toLowerCase())){alert("Diese Kategorie gibt es bereits.");return}
  data.categories.push(name);el.value="";save();
}
function deleteCategory(i){
  const name=data.categories[i];
  if(data.expenses.some(e=>e.category===name)){alert("Die Kategorie kann nicht gelöscht werden, solange Ausgaben darin vorhanden sind.");return}
  if(data.categories.length===1){alert("Mindestens eine Kategorie muss vorhanden sein.");return}
  data.categories.splice(i,1);save();
}
document.getElementById("expenseForm").addEventListener("submit",e=>{
  e.preventDefault();
  const amount=parseFloat(document.getElementById("amount").value);
  const category=document.getElementById("category").value;
  const description=document.getElementById("description").value.trim();
  if(!amount||amount<=0)return;
  data.expenses.unshift({id:Date.now(),amount,category,description,date:new Date().toLocaleDateString("de-DE")});
  e.target.reset();save();
});
function deleteExpense(id){data.expenses=data.expenses.filter(e=>e.id!==id);save()}
function resetData(){if(confirm("Wirklich alle Ausgaben und eigenen Kategorien löschen?")){data={categories:[...defaultCategories],expenses:[]};save()}}
function render(){
  const total=data.expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById("total").textContent=euro(total);
  document.getElementById("count").textContent=data.expenses.length;
  document.getElementById("catCount").textContent=data.categories.length;
  document.getElementById("category").innerHTML=data.categories.map(c=>`<option>${escapeHtml(c)}</option>`).join("");
  document.getElementById("categoryList").innerHTML=data.categories.map((c,i)=>`<span class="chip">${escapeHtml(c)} <button class="danger" onclick="deleteCategory(${i})">×</button></span>`).join("");
  const list=document.getElementById("expenseList");
  list.innerHTML=data.expenses.length?data.expenses.map(e=>`<div class="expense"><div><strong>${escapeHtml(e.category)}</strong><div class="muted small">${escapeHtml(e.description||"Keine Beschreibung")} · ${e.date}</div></div><div style="display:flex;align-items:center;gap:10px"><span class="amount">${euro(e.amount)}</span><button class="danger" onclick="deleteExpense(${e.id})">Löschen</button></div></div>`).join(""):'<div class="empty">Noch keine Ausgaben vorhanden.</div>';
  drawChart();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function drawChart(){
  const canvas=document.getElementById("pie"),ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const sums={};data.expenses.forEach(e=>sums[e.category]=(sums[e.category]||0)+e.amount);
  const entries=Object.entries(sums),total=entries.reduce((s,[,v])=>s+v,0),cx=160,cy=160,r=120;
  if(!entries.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle="#eef0f4";ctx.fill();ctx.fillStyle="#6b7280";ctx.font="15px system-ui";ctx.textAlign="center";ctx.fillText("Noch keine Daten",cx,cy+5);document.getElementById("legend").innerHTML="";return}
  let start=-Math.PI/2;
  entries.forEach(([name,val],i)=>{
    const angle=val/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+angle);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();start+=angle;
  });
  ctx.beginPath();ctx.arc(cx,cy,58,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.fillStyle="#172033";ctx.font="700 17px system-ui";ctx.textAlign="center";ctx.fillText(euro(total),cx,cy+6);
  document.getElementById("legend").innerHTML=entries.map(([name,val],i)=>`<div class="legend-item"><span><i class="dot" style="background:${colors[i%colors.length]}"></i>${escapeHtml(name)}</span><strong>${euro(val)}</strong></div>`).join("");
}
render();
</script>
</body>
</html>
